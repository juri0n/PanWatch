name: Crypto compatibility
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  crypto:
    strategy:
      matrix:
        python: ['3.11', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-crypto.txt pytest
      - run: python -m pytest crypto_tests -q
      - run: python -m pip check
  stock-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangocairo-1.0-0 libpangoft2-1.0-0 libcairo2 fonts-noto-cjk
      - run: python -m pip install -r requirements.txt -r requirements-crypto.txt
      - run: |
          python -m pytest tests/ -q
          python -m pytest crypto_tests/ -q
          for package in packages/*; do
            if [ -d "$package/tests" ]; then python -m pytest "$package/tests" -q || exit 1; fi
          done
  stock-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:ui && pnpm check:i18n && pnpm check:market-colors
      - run: pnpm run test --run && pnpm build

  required-status:
    needs: [crypto, stock-backend, stock-frontend]
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      # No checkout, candidate code, or inherited secrets in this write-capable job.
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          CRYPTO_RESULT: ${{ needs.crypto.result }}
          BACKEND_RESULT: ${{ needs.stock-backend.result }}
          FRONTEND_RESULT: ${{ needs.stock-frontend.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          state=failure
          if [ "$CRYPTO_RESULT" = success ] && [ "$BACKEND_RESULT" = success ] && [ "$FRONTEND_RESULT" = success ]; then state=success; fi
          gh api --method POST "repos/$GH_REPO/statuses/$SHA" -f state="$state" -f context=panwatch-crypto/upstream-compat -f target_url="$RUN_URL" -f description="Crypto/stock/frontend compatibility: $state"
          test "$state" = success
